<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>이미지 명함 읽기 테스트</title>
<style>
  body { margin: 0; background: #f6f5f2; color: #141414; font-family: 'Noto Sans KR', system-ui, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: #555; font-size: 14px; line-height: 1.6; margin: 0 0 14px; }
  .btn { border: 0; border-radius: 10px; padding: 12px 16px; font: 700 14px sans-serif; background: #1F3A5F; color: #fff; cursor: pointer; }
  .btn.ghost { background: #fff; color: #141414; border: 1.5px solid #ddd; }
  .item { display: grid; grid-template-columns: 140px 110px 1fr; gap: 14px; background: #fff; border: 1px solid #e3e1dc; border-radius: 14px; padding: 14px; margin-top: 12px; align-items: start; }
  .item img { width: 140px; border-radius: 8px; }
  .item canvas { width: 110px; height: 138px; border-radius: 8px; background: #eee; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  td { border-bottom: 1px solid #eee; padding: 5px 6px; vertical-align: top; }
  td:first-child { color: #777; white-space: nowrap; width: 90px; }
  .empty { color: #bbb; }
  .meta { font-size: 12px; color: #777; margin-top: 6px; }
  @media (max-width: 640px) { .item { grid-template-columns: 1fr 1fr; } .item table { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>이미지 명함 읽기 테스트</h1>
  <p>명함 이미지 여러 장을 한 번에 골라 실제 Worker(/autocard/import)로 읽어봐요. 결과는 이 화면에만 보이고 저장되지 않아요.<br>
     다 읽으면 <b>결과 복사</b>를 눌러 Claude에게 붙여넣어 주세요. (같은 이미지는 캐시돼서 다시 읽어도 횟수가 줄지 않아요)</p>
  <button class="btn" id="pick">이미지 고르기 (여러 장)</button>
  <button class="btn ghost" id="copy" disabled>결과 복사</button>
  <input type="file" id="files" accept="image/*" multiple hidden>
  <div id="list"></div>
</div>
<script src="assets/common.js"></script>
<script>
const $ = id => document.getElementById(id);
const results = [];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function resize(file, max) {
  return new Promise((ok, no) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); ok({ url: c.toDataURL('image/jpeg', 0.85), img: im, w: im.width, h: im.height }); };
    im.onerror = no; im.src = u;
  });
}
async function sha(b64) { const b = atob(b64), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return [...new Uint8Array(await crypto.subtle.digest('SHA-256', a))].map(x => x.toString(16).padStart(2, '0')).join(''); }
function devId() { try { let d = localStorage.getItem('autocard_device'); if (!d) { d = crypto.randomUUID(); localStorage.setItem('autocard_device', d); } return d; } catch (e) { return ''; } }
$('pick').onclick = () => $('files').click();
$('files').onchange = async e => {
  for (const f of e.target.files) {
    const box = document.createElement('div'); box.className = 'item'; box.innerHTML = `<div>${esc(f.name)}<div class="meta">읽는 중…</div></div>`; $('list').appendChild(box);
    const t0 = performance.now();
    try {
      const r = await resize(f, 1600), b64 = r.url.split(',')[1];
      const res = await fetch(AC_WORKER + '/autocard/import', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: b64, mediaType: 'image/jpeg', hash: await sha(b64), deviceId: devId() }) });
      const d = await res.json(), sec = ((performance.now() - t0) / 1000).toFixed(1);
      results.push({ file: f.name, seconds: +sec, status: res.status, result: d });
      const rows = ['name', 'title', 'company', 'phone', 'phone2', 'email', 'website', 'address', 'slogan', 'specialties', 'referral', 'career', 'chapter']
        .map(k => { const v = Array.isArray(d[k]) ? d[k].join(' / ') : d[k]; return `<tr><td>${k}</td><td>${v ? esc(v) : '<span class="empty">(없음)</span>'}</td></tr>`; }).join('');
      box.innerHTML = `<div><img src="${r.url}"><div class="meta">${esc(f.name)}<br>${sec}초${d.cached ? ' · 캐시' : ''}${d.error ? '<br><b style="color:#b3261e">' + esc(d.error) + '</b>' : ''}</div></div>
        <canvas width="220" height="276"></canvas><table>${rows}</table>`;
      const cv = box.querySelector('canvas'), g = cv.getContext('2d'), b = d.photoBox;
      if (b) { const im = new Image(); im.onload = () => { const W = im.width, H = im.height; let w = b.w / 100 * W, h = w * 1.25; const bh = b.h / 100 * H; if (h > bh) { h = bh; w = h / 1.25; }
        const x = b.x / 100 * W + (b.w / 100 * W - w) / 2, y = b.y / 100 * H; g.drawImage(im, x, y, w, h, 0, 0, cv.width, cv.height); }; im.src = r.url; }
      else { g.fillStyle = '#999'; g.font = '20px sans-serif'; g.fillText('사진 없음', 60, 140); }
    } catch (err) { box.querySelector('.meta').textContent = '실패: ' + err.message; results.push({ file: f.name, error: err.message }); }
    $('copy').disabled = false;
  }
};
$('copy').onclick = async () => {
  const txt = JSON.stringify(results, null, 1);
  try { await navigator.clipboard.writeText(txt); $('copy').textContent = '복사됐어요 ✓'; } catch (e) { prompt('아래를 복사하세요', txt); }
};
</script>
</body>
</html>

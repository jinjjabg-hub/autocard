<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자동 명함 만들기</title>
<meta name="description" content="5분이면 끝나는 디지털 명함 — 5,900원부터, 카드북 저장까지 한 번에">
<meta property="og:title" content="5분 디지털 명함 · 5,900원">
<meta property="og:description" content="질문 3개에 답하면 AI가 소개 문구를 써드려요. 받은 사람은 카드북에 바로 저장!">
<meta name="theme-color" content="#1F3A5F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/card.css">
<style>
  :root { --ink: #141414; --muted: #6b6b6b; --line: #e3e1dc; --bg: #f6f5f2; --paper: #fff; --brand: #1F3A5F; --brand-ink: #fff; --ok: #1d7a4f; --warn: #a15c00; --err: #b3261e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  .app { max-width: 520px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 14px 16px 10px; }
  .toprow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { font-weight: 800; font-size: 15px; }
  .price { font-weight: 800; font-size: 14px; background: var(--ink); color: #fff; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--brand); transition: width .25s; }
  .stepname { margin-top: 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
  main { flex: 1; padding: 6px 16px 120px; }
  h2 { font-size: 22px; line-height: 1.35; margin: 10px 0 6px; font-weight: 800; }
  .lead { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 18px; }
  label.f { display: block; font-size: 13px; font-weight: 700; margin: 16px 0 6px; }
  label.f small { font-weight: 500; color: var(--muted); }
  input.t, textarea.t { width: 100%; background: var(--paper); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: 16px; outline: none; }
  input.t:focus, textarea.t:focus { border-color: var(--brand); }
  textarea.t { resize: vertical; min-height: 84px; line-height: 1.55; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chip.on { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); }
  .chip:disabled { opacity: .4; cursor: not-allowed; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
  .pricebox { display: flex; justify-content: space-between; align-items: baseline; }
  .pricebox b { font-size: 26px; }
  .pricebox span { color: var(--muted); font-size: 13px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 18px; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--ink); color: #fff; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.brand { background: var(--brand); color: var(--brand-ink); }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { min-width: 0; }
  .x { border: 0; background: transparent; font-size: 20px; color: var(--muted); cursor: pointer; padding: 6px 8px; }
  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: linear-gradient(transparent, var(--bg) 30%); padding: 20px 16px calc(14px + env(safe-area-inset-bottom)); }
  nav.bottom .in { max-width: 488px; margin: 0 auto; display: flex; gap: 10px; }
  nav.bottom .btn { flex: 1; }
  nav.bottom .btn.ghost { flex: 0 0 96px; background: var(--bg); }
  .err { color: var(--err); font-size: 13px; margin-top: 10px; font-weight: 600; min-height: 1em; }
  .warn { color: var(--warn); font-size: 12.5px; margin-top: 8px; font-weight: 600; line-height: 1.5; }
  .ai { width: 100%; margin: 16px 0 4px; background: linear-gradient(135deg, #1F3A5F, #4B3F72); }
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .up { display: flex; gap: 14px; align-items: center; }
  .upimg { width: 88px; height: 88px; flex-shrink: 0; border-radius: 16px; background: #ebe9e4 center/cover no-repeat; border: 1.5px dashed #c9c6bf; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 26px; overflow: hidden; }
  .upimg.round { border-radius: 50%; }
  .upimg.contain { background-size: contain; background-color: #fff; }
  .upimg.has { border-style: solid; font-size: 0; }
  .seg { display: flex; background: #ebe9e4; border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 10px 6px; font-size: 13.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tpls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tpl { border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; }
  .tpl.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
  .tpl .thumb { height: 150px; overflow: hidden; position: relative; pointer-events: none; }
  .tpl .thumb > div { width: 360px; transform: scale(.3); transform-origin: top left; position: absolute; top: 0; left: 0; }
  .tpl .thumb .ac-save { animation: none; }
  .tpl .thumb .ac-dock { display: none; }
  .fonts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .fontbtn { border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 8px; cursor: pointer; text-align: center; }
  .fontbtn.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .fontbtn b { display: block; font-size: 19px; line-height: 1.3; font-weight: 700; }
  .fontbtn small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .tpl span { display: block; font-size: 11.5px; font-weight: 700; padding: 7px 8px; line-height: 1.3; }
  .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .preset { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: left; }
  .preset.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .dots { display: flex; flex-shrink: 0; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #fff; margin-left: -5px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .dots i:first-child { margin-left: 0; }
  .swrow { margin-top: 12px; }
  .swrow .lab { font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  .swrow .lab small { color: var(--muted); font-weight: 500; }
  .sws { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .sw { aspect-ratio: 1; border-radius: 10px; border: 1.5px solid rgba(0,0,0,.12); cursor: pointer; padding: 0; }
  .sw.on { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .phone { margin: 18px auto 0; max-width: 380px; border-radius: 28px; border: 8px solid #1b1b1b; overflow: hidden; background: #1b1b1b; }
  .phone .scr { max-height: 600px; overflow-y: auto; border-radius: 20px; background: #fff; }
  .phone .scr .ac-card { pointer-events: none; }
  .tabs { display: flex; gap: 6px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  details.tr { margin-top: 14px; }
  details.tr summary { cursor: pointer; font-weight: 700; font-size: 14px; }
  .trlang { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .trlang b { font-size: 13px; }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.55; margin-top: 14px; cursor: pointer; }
  .consent input { width: 18px; height: 18px; margin-top: 1px; flex-shrink: 0; accent-color: var(--brand); }
  .consent a { color: var(--brand); }
  .done { text-align: center; padding: 24px 4px; }
  .done .big { font-size: 44px; }
  .linkbox { display: flex; gap: 8px; margin-top: 14px; }
  .linkbox input { flex: 1; font-size: 13px; }
  .inapp { background: #FFF4D6; color: #6A4B00; font-size: 13px; line-height: 1.55; padding: 12px 14px; border-radius: 12px; margin-bottom: 12px; font-weight: 600; }
  .t.auto { background: #FFF8D6; border-color: #E6C75A; }
  .autohint { font-size: 12px; color: #7A5B00; margin-top: 5px; font-weight: 600; }
  .autohint::before { content: '✨ '; }
  .startcard { display: block; width: 100%; text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 18px; padding: 20px; margin-top: 14px; cursor: pointer; }
  .startcard.rec { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .startcard b { display: block; font-size: 17px; margin-bottom: 4px; }
  .startcard span { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
  .startcard em { font-style: normal; font-size: 11px; font-weight: 800; background: var(--brand); color: #fff; border-radius: 999px; padding: 3px 8px; margin-left: 6px; vertical-align: 2px; }
  .reading { text-align: center; padding: 10px 0; }
  .reading img { max-width: 70%; max-height: 360px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  .reading .spinner { display: inline-block; vertical-align: middle; border-color: #ccc; border-top-color: #333; margin-right: 6px; }
  .cropwrap { display: flex; justify-content: center; margin: 14px 0; }
  #cropCanvas { width: 240px; height: 300px; border-radius: 16px; touch-action: none; cursor: grab; box-shadow: 0 8px 24px rgba(0,0,0,.18); background: #eee; }
  .slider { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; margin-top: 10px; }
  .slider input { flex: 1; accent-color: var(--brand); }
  .callout { background: #EEF3FA; border-left: 4px solid var(--brand); padding: 12px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.6; margin: 6px 0 4px; }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 13px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; }
  .uisel { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 8px; font-size: 12.5px; font-weight: 700; color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="toprow"><div class="brand" id="brand">자동 명함</div><div class="row"><select id="uiLang" class="uisel" aria-label="Language"></select><div class="price" id="price">5,900원</div></div></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="stepname" id="stepname"></div>
  </header>
  <main id="screen"></main>
</div>
<nav class="bottom"><div class="in">
  <button type="button" class="btn ghost" id="prevBtn">이전</button>
  <button type="button" class="btn" id="nextBtn">다음</button>
</div></nav>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="image/*" hidden>

<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-storage-compat.js"></script>
<script src="assets/common.js"></script>
<script src="assets/card.js"></script>
<script src="assets/i18n.js"></script>
<script>
// ===================================================================
// 상태 — 입력하는 족족 localStorage에 저장 (중간에 나가도 이어서 작성)
// ===================================================================
const STORE_KEY = 'autocard_draft_v1';
const NAME_PH = { ko: '홍길동', en: 'Gildong Hong', ja: '山田 太郎', zh: '洪吉童', vi: 'Hong Gil Dong', mn: 'Хон Гилдон', th: 'สมชาย ใจดี', es: 'María García', fr: 'Marie Dupont' };

function blankState() {
  return {
    step: 0, cardId: null, status: 'draft', createdAt: 0, ref: '',
    mode: '', auto: {},   // mode: 'import'(이미지 명함으로 시작) | 'manual'. auto: 이미지에서 자동으로 채운 칸(확인 전)
    langs: [UI],   // 처음 기본 언어 = 화면 언어(외국인은 자기 언어로 바로 시작, 목록에 없는 언어도)
    name: {}, title: {}, company: {}, nameAuto: {},   // nameAuto: 번역 때 자동으로 넣은 다른 언어 이름(본인이 고치면 덮어쓰지 않음)
    phone: '', phone2: '', email: '', links: [], chapter: '', showChapter: true,
    answers: { work: '', customer: '', referral: '' },
    copy: {},
    images: { profile: '', second: '', secondType: 'hero' },
    design: { tpl: 'minimal', colorMode: 'preset', presetIdx: 0, main: AC_PRESETS[0][1], sub: AC_PRESETS[0][2], point: AC_PRESETS[0][3], photo: 'large' },
    trKey: '',
  };
}
let S = blankState();
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(blankState(), JSON.parse(raw)); } catch (e) {}
const qs = new URLSearchParams(location.search);
if (!S.ref && qs.get('ref')) S.ref = qs.get('ref').slice(0, 40);   // 어떤 명함을 보고 왔는지 → 확산 측정용

// 이미지 명함 가져오기 진행 상태 — 원본 이미지는 이 변수(메모리)에만 있고 저장하지 않는다
const IMP = { stage: null, img: '', w: 0, h: 0, result: null, crop: null, error: '' };
const splitLines = v => String(v || '').split('\n').map(x => x.trim()).filter(Boolean).slice(0, 8);
let saveWarned = false;
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) {
    // 사진 때문에 용량이 넘치면 사진만 빼고라도 저장
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...S, images: { ...S.images, profile: '', second: '' } })); } catch (e2) {}
    if (!saveWarned) { saveWarned = true; toast(t('save_warn')); }
  }
}
const base = () => S.langs[0];
const $ = id => document.getElementById(id);
const esc = acEsc;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600); }
// 명함 본문 문구 4개 — 순서가 곧 명함에 나오는 순서
const COPY_FIELDS = [   // [키, 이름표 번역키, 설명 번역키, 칸 높이]
  ['slogan', 'f_slogan', 'f_slogan_sub', 64],
  ['work', 'f_work', 'f_work_sub', 96],
  ['help', 'f_help', 'f_help_sub', 96],
  ['referral', 'f_ref', 'f_ref_sub', 84],
];
function copyOf(l) { S.copy[l] = Object.assign({ slogan: '', work: '', help: '', referral: '', specialties: [] }, S.copy[l]); return S.copy[l]; }
// 이미지에서 자동으로 채운 칸 표시 — 사용자가 고치면 표시가 사라짐
const autoCls = k => S.auto && S.auto[k] ? ' auto' : '';
const autoHint = k => S.auto && S.auto[k] ? `<div class="autohint" data-hint="${k}">${t('auto_hint')}</div>` : '';
function unauto(k) { if (S.auto && S.auto[k]) { delete S.auto[k]; document.querySelectorAll(`[data-auto="${k}"]`).forEach(x => x.classList.remove('auto')); document.querySelectorAll(`[data-hint="${k}"]`).forEach(x => x.remove()); } }
function onlyLangs(o) { const r = {}; S.langs.forEach(l => { if (o[l] !== undefined) r[l] = o[l]; }); return r; }   // 뺀 언어의 값은 저장하지 않음
function cardData() {   // 렌더러·Firestore에 넘기는 명함 데이터 (스펙의 autocards 구조)
  return {
    langs: S.langs, name: onlyLangs(S.name), title: onlyLangs(S.title), company: onlyLangs(S.company),
    phone: S.phone, phone2: S.phone2 || '', email: S.email, links: S.links.filter(l => l.url),
    chapter: S.chapter || '', showChapter: S.showChapter !== false,
    answers: S.answers, copy: onlyLangs(S.copy), images: S.images,
    design: { tpl: S.design.tpl, colorMode: S.design.colorMode, main: S.design.main, sub: S.design.sub, point: S.design.point, photo: S.design.photo || 'small', ...(AC_FONTS[S.design.font] ? { font: S.design.font } : {}) },
    price: acPrice(S.langs),
  };
}

// 인앱 브라우저(카톡 등)에서는 Google 로그인이 막힌다 → 안드로이드는 처음부터 크롬으로 보냄(입력값이 브라우저별로 저장되므로 시작 전에!)
const UA = navigator.userAgent;
const IN_APP = /KAKAOTALK|Instagram|FBAN|FBAV|NAVER|Line\//i.test(UA);
if (/KAKAOTALK/i.test(UA) && /Android/i.test(UA)) location.href = 'intent://' + location.href.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';

// ===================================================================
// 화면
// ===================================================================
function render() {
  document.title = t('doc_title'); $('brand').textContent = t('brand');
  $('prevBtn').textContent = t('prev'); $('nextBtn').textContent = t('next');
  $('price').textContent = acWon(acPrice(S.langs));
  $('bar').style.width = (S.step / 7 * 100) + '%';
  $('stepname').textContent = S.step ? `${S.step} / 7 · ${t('step' + S.step)}` : t('start');
  $('prevBtn').style.visibility = S.step >= 1 && S.status === 'draft' ? 'visible' : 'hidden';
  $('nextBtn').style.display = S.step >= 1 && S.step < 7 ? '' : 'none';
  document.querySelector('nav.bottom').style.display = S.step === 0 ? 'none' : '';
  $('screen').innerHTML = VIEWS[S.step]();
  (AFTER[S.step] || (() => {}))();
  window.scrollTo(0, 0);
}

const VIEWS = {
  0() {
    if (IMP.stage === 'reading') return `<h2>${t('reading_h')}</h2>
      <div class="reading"><img src="${IMP.img}" alt=""><p><span class="spinner"></span>${t('reading_p')}</p></div>`;
    if (IMP.stage === 'photo') return `<h2>${t('photo_h')}</h2>
      <p class="lead">${t('photo_p')}</p>
      <div class="cropwrap"><canvas id="cropCanvas" width="480" height="600"></canvas></div>
      <label class="slider">${t('size')} <input type="range" id="cropZoom" min="20" max="100" step="1"></label>
      <button type="button" class="btn brand wide" id="useCrop" style="margin-top:18px">${t('use_crop')}</button>
      <button type="button" class="btn ghost wide" id="otherPhoto" style="margin-top:10px">${t('other_photo')}</button>
      <button type="button" class="btn ghost wide" id="noPhoto" style="margin-top:10px;border:0;color:var(--muted)">${t('no_photo')}</button>`;
    return `${IN_APP ? `<div class="inapp">${t('inapp')}</div>` : ''}
      <h2>${t('start_h')}</h2>
      <p class="lead">${t('start_p', { price: acWon(AC_BASE_PRICE) })}</p>
      ${IMP.stage === 'error' ? `<div class="err">${esc(IMP.error)}</div>${IMP.limited ? `<button type="button" class="btn ghost" id="adminLogin" style="margin-top:8px">${t('admin_retry')}</button>` : ''}` : ''}
      <button type="button" class="startcard rec" id="startImport"><b>${t('imp_title')} <em>${t('imp_badge')}</em></b>
        <span>${t('imp_desc')}</span></button>
      <button type="button" class="startcard" id="startManual"><b>${t('man_title')}</b><span>${t('man_desc')}</span></button>`;
  },
  1() {
    const extras = S.langs.slice(1);
    return `${IN_APP ? `<div class="inapp">${t('inapp')}</div>` : ''}

let previewLang = null;
function drawPreview(lang) {
  const el = $('preview'); if (!el) return;
  acRender(el, cardData(), lang || base());
}

const AFTER = {
  1() {
    document.querySelectorAll('[data-base]').forEach(b => b.onclick = () => {
      const k = b.dataset.base, prev = base();
      S.langs = [k, ...S.langs.filter(l => l !== k)].slice(0, AC_MAX_LANGS);
      // 기본 언어 = 직접 적는 언어. 이미 적어둔(또는 이미지에서 읽은) 직함·회사·문구는 새 기본 언어 칸으로 따라가게
      if (prev && prev !== k) {
        ['title', 'company'].forEach(f => { if (!(S[f][k] || '').trim() && S[f][prev]) S[f][k] = S[f][prev]; });
        const pc = S.copy[prev], nc = S.copy[k];
        if (pc && !(nc && [nc.slogan, nc.work, nc.help, nc.referral].some(x => (x || '').trim()))) S.copy[k] = JSON.parse(JSON.stringify(pc));
      }
      S.trKey = ''; save(); render();
    });
    document.querySelectorAll('[data-extra]').forEach(b => b.onclick = () => {
      const k = b.dataset.extra;
      S.langs = S.langs.includes(k) ? S.langs.filter(l => l !== k) : [...S.langs, k].slice(0, AC_MAX_LANGS);
      save(); render();
    });
  },
  2() {
    document.querySelectorAll('[data-name]').forEach(i => i.oninput = () => { S.name[i.dataset.name] = i.value; if (i.dataset.auto) unauto('name'); save(); });
    $('title').oninput = e => { S.title[base()] = e.target.value; unauto('title'); save(); };
  },
  3() {
    $('company').oninput = e => { S.company[base()] = e.target.value; unauto('company'); save(); };
    $('phone').oninput = e => { S.phone = e.target.value; unauto('phone'); save(); };
    $('phone').onblur = e => { S.phone = fmtPhone(e.target.value); e.target.value = S.phone; save(); };
    $('email').oninput = e => { S.email = e.target.value.trim(); unauto('email'); save(); };
    $('phone2').oninput = e => { S.phone2 = e.target.value; unauto('phone2'); save(); };
    $('phone2').onblur = e => { S.phone2 = fmtPhone(e.target.value); e.target.value = S.phone2; save(); };
    $('chapter').oninput = e => { S.chapter = e.target.value.trim(); unauto('chapter'); save(); };
    $('showChapter').onchange = e => { S.showChapter = e.target.checked; save(); };
    document.querySelectorAll('[data-ll]').forEach(i => i.oninput = () => { S.links[i.dataset.ll].label = i.value; save(); });
    document.querySelectorAll('[data-lu]').forEach(i => i.oninput = () => { const l = S.links[i.dataset.lu]; l.url = i.value.trim(); delete l.auto; i.classList.remove('auto'); save(); });
    document.querySelectorAll('[data-ldel]').forEach(b => b.onclick = () => { S.links.splice(+b.dataset.ldel, 1); save(); render(); });
    const add = $('addLink'); if (add) add.onclick = () => { S.links.push({ label: '', url: '' }); save(); render(); };
  },
  0() {
    if (IMP.stage === 'photo') return setupCrop();
    if (IMP.stage === 'reading') return;
    $('startImport').onclick = () => { $('importInput').value = ''; $('importInput').click(); };
    if ($('adminLogin')) $('adminLogin').onclick = adminLogin;
    $('startManual').onclick = () => { S.mode = 'manual'; S.step = 1; IMP.stage = null; save(); render(); };
  },
  4() {
    document.querySelectorAll('[data-ans]').forEach(t => t.oninput = () => { S.answers[t.dataset.ans] = t.value; unauto(t.dataset.auto); save(); });
    document.querySelectorAll('[data-copy]').forEach(t => t.oninput = () => { copyOf(base())[t.dataset.copy] = t.value; unauto(t.dataset.copy); save(); });
    $('specs').oninput = e => { copyOf(base()).specialties = splitLines(e.target.value); unauto('specialties'); save(); };
    $('aiBtn').onclick = aiDraft;
    if (S.mode === 'import' && !S.answers.referral.trim()) $('q3').focus({ preventScroll: true });
  },
  5() {
    document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => pickImage(b.dataset.pick));
    document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { S.images[b.dataset.rm] = ''; save(); render(); });
    document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { S.images.secondType = b.dataset.st; save(); render(); });
  },
  6() {
    const d = S.design;
    // 템플릿 썸네일도 실제 렌더러로 그림 → 고른 모습 = 발행되는 모습
    document.querySelectorAll('[data-thumb]').forEach(el => acRender(el, { ...cardData(), design: { ...d, tpl: el.dataset.thumb } }, base()));
    drawPreview();
    document.querySelectorAll('[data-tpl]').forEach(b => b.onclick = () => { d.tpl = b.dataset.tpl; save(); render(); });
    document.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => { d.photo = b.dataset.ph; save(); render(); });
    Object.keys(AC_FONTS).forEach(acLoadFont);   // 글꼴 버튼 미리보기용
    document.querySelectorAll('[data-font]').forEach(b => b.onclick = () => { d.font = b.dataset.font; save(); render(); });
    document.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => {
      d.colorMode = b.dataset.cm;
      if (d.colorMode === 'image' && S.imgStyle) Object.assign(d, S.imgStyle);
      if (d.colorMode === 'random') roll();
      if (d.colorMode === 'preset') setPreset(d.presetIdx);
      save(); render();
    });
    document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { setPreset(+b.dataset.preset); save(); render(); });
    const r = $('rollBtn'); if (r) r.onclick = () => { roll(); save(); render(); };
    document.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { d[b.dataset.sw] = b.dataset.c; save(); render(); });
  },
  7() {
    if (S.status !== 'draft') {
      $('copyBtn').onclick = async () => { try { await navigator.clipboard.writeText($('myUrl').value); toast(t('copied')); } catch (e) { $('myUrl').select(); } };
      $('newBtn').onclick = () => { if (confirm(t('new_confirm'))) { S = blankState(); IMP.stage = null; save(); render(); } };
      refreshStatus();
      return;
    }
    if (!S.langs.includes(previewLang)) previewLang = base();
    drawPreview(previewLang);
    const fx = $('fixLangBtn'); if (fx) fx.onclick = fixBaseLang;

function fmtPhone(v) {
  const d = String(v || '').replace(/[^0-9]/g, '');
  if (/^02\d{7,8}$/.test(d)) return d.replace(/^(02)(\d{3,4})(\d{4})$/, '$1-$2-$3');
  if (/^0\d{9,10}$/.test(d)) return d.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
  return String(v || '').trim();   // 해외 번호 등은 입력 그대로

    S.trKey = ''; save(); render(); toast(t('tr_into_done', { lang: AC_LANGS[b] }));
  } catch (e) { btn.disabled = false; btn.textContent = t('retry'); toast(t('tr_fail', { m: e.message })); }

async function callWorker(path, body, timeoutMs = 30000) {
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const res = await fetch(AC_WORKER + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl.signal });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) { const er = new Error(data.error || t('srv_err', { s: res.status })); er.data = data; throw er; }
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error(t('slow'));
    if (e instanceof TypeError) throw new Error(t('offline'));
    throw e;
  }
  finally { clearTimeout(timer); }
}

function deviceId() {

    return id;

}
// 로그인돼 있으면(카드북과 같은 로그인) 토큰을 함께 보냄 → 관리자 계정은 하루 제한 없음. 서버가 직접 확인한다
async function currentIdToken() {
  try {
    const { auth } = fb();
    const u = auth.currentUser || await new Promise(r => { const un = auth.onAuthStateChanged(x => { un(); r(x); }); setTimeout(() => r(null), 2500); });
    return u ? await u.getIdToken() : '';
  } catch (e) { return ''; }
}
async function adminLogin() {
  try { const { auth } = fb(); await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());

  catch (e) { if (e.code !== 'auth/popup-closed-by-user') toast(t('login_fail', { m: e.message || e.code })); }
}
async function sha256Hex(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(b => b.toString(16).padStart(2, '0')).join('');
}
$('importInput').onchange = async e => {

// 추출 결과 → 각 단계 칸. 채운 칸은 S.auto에 표시(노란 배경 + "확인해주세요")
function applyImport(r) {

  set('name', r.name, () => { S.name[b] = r.name; });
  set('title', r.title, () => { S.title[b] = r.title; });
  set('company', r.company, () => { S.company[b] = r.company; });
  set('phone', r.phone, () => { S.phone = r.phone; });
  set('phone2', r.phone2, () => { S.phone2 = r.phone2; });
  set('email', r.email, () => { S.email = r.email; });
  set('chapter', r.chapter, () => { S.chapter = r.chapter; S.showChapter = true; });
  // 링크: 홈페이지 + SNS(인스타·블로그 등). 이미 있는 주소는 건너뜀, 최대 3개
  const found = [r.website ? { label: t('homepage'), url: r.website } : null, ...(r.sns || [])].filter(Boolean)
    .filter(l => !S.links.some(x => x.url === l.url)).map(l => ({ ...l, auto: true }));

  set('slogan', r.slogan, () => { c.slogan = r.slogan; });
  set('specialties', r.specialties && r.specialties.length, () => { c.specialties = r.specialties.slice(); });
  // 4단계 질문 초안: Q1 = 하는 일(전문분야·경력), Q2 = 슬로건, Q3 = 이미지에 리퍼럴이 있을 때만
  const q1 = [r.company && r.title ? `${r.company} ${r.title}` : r.company || r.title,
    r.specialties && r.specialties.length ? t('specs_l') + ': ' + r.specialties.join(', ') : '',
    r.career && r.career.length ? t('career') + ': ' + r.career.join(', ') : ''].filter(Boolean).join('\n');

  set('q3', r.referral && r.referral.length && !S.answers.referral.trim(), () => { S.answers.referral = r.referral.join('\n'); });

  const st = r.style || {};
  if (st.main) { S.imgStyle = acFixColors(st); Object.assign(S.design, S.imgStyle, { colorMode: 'image' }); A.style = 1; }
  if (st.tpl) S.design.tpl = st.tpl;
  if (st.font) S.design.font = st.font;

function finishImport() {

// ---- 인물 사진 자르기 (4:5 세로) ----
const CROP_R = 1.25;
function initialCrop(b) {
  const W = IMP.w, H = IMP.h;
  const bx = b.x / 100 * W, by = b.y / 100 * H, bw = b.w / 100 * W, bh = b.h / 100 * H;
  let w = bw, h = w * CROP_R;
  if (h > bh) { h = bh; w = h / CROP_R; }           // 인물 영역 안에 들어가게
  w = Math.min(w, W, H / CROP_R) * 0.88;              // 포스터는 인물 바로 옆에 글자가 많아서 가장자리를 조금 덜어냄
  const x = bx + (bw - w) / 2, y = by + (bh - w * CROP_R) * 0.15;   // 가운데 정렬, 머리가 잘리지 않게 위쪽 가까이
  return clampCrop({ x, y, w });
}
function maxCropW() { return Math.min(IMP.w, IMP.h / CROP_R); }
function clampCrop(c) {
  c.w = Math.max(40, Math.min(c.w, maxCropW()));
  c.x = Math.max(0, Math.min(c.x, IMP.w - c.w));
  c.y = Math.max(0, Math.min(c.y, IMP.h - c.w * CROP_R));
  return c;
}
function drawCrop() {
  const cv = $('cropCanvas'); if (!cv || !IMP.el) return;
  const g = cv.getContext('2d'), c = IMP.crop;
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  g.drawImage(IMP.el, c.x, c.y, c.w, c.w * CROP_R, 0, 0, cv.width, cv.height);
}
function setupCrop() {
  const cv = $('cropCanvas'), zoom = $('cropZoom');
  zoom.value = Math.round(IMP.crop.w / maxCropW() * 100);
  drawCrop();
  zoom.oninput = () => {   // 가운데를 기준으로 크기 조절
    const c = IMP.crop, cx = c.x + c.w / 2, cy = c.y + c.w * CROP_R / 2, w = maxCropW() * zoom.value / 100;
    IMP.crop = clampCrop({ x: cx - w / 2, y: cy - w * CROP_R / 2, w }); drawCrop();
  };
  let drag = null;   // 끌어서 위치 맞추기(손가락·마우스)
  cv.onpointerdown = e => { drag = { x: e.clientX, y: e.clientY, c: { ...IMP.crop } }; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => {
    if (!drag) return;
    const k = IMP.crop.w / cv.clientWidth;   // 화면 1px = 원본 몇 px
    IMP.crop = clampCrop({ ...drag.c, x: drag.c.x - (e.clientX - drag.x) * k, y: drag.c.y - (e.clientY - drag.y) * k }); drawCrop();
  };
  cv.onpointerup = cv.onpointercancel = () => { drag = null; };
  $('useCrop').onclick = () => {
    const out = document.createElement('canvas'), c = IMP.crop, w = Math.min(800, Math.round(c.w));
    out.width = w; out.height = Math.round(w * CROP_R);
    const g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height);
    g.drawImage(IMP.el, c.x, c.y, c.w, c.w * CROP_R, 0, 0, out.width, out.height);
    S.images.profile = out.toDataURL('image/jpeg', 0.88);   // 잘라낸 프로필만 남김(발행 때 Storage에 올라감)
    S.design.photo = 'large';
    finishImport();
  };
  $('otherPhoto').onclick = () => { afterPick = finishImport; pickImage('profile'); };
  $('noPhoto').onclick = () => { S.images.profile = ''; finishImport(); };
}

// 사진 — 올리기 전에 1200px로 줄임 (용량·로딩 속도)
// ===================================================================
let pickTarget = null, afterPick = null;
function pickImage(which) { pickTarget = which; $('fileInput').value = ''; $('fileInput').click(); }
$('fileInput').onchange = async e => {
  const f = e.target.files[0]; if (!f || !pickTarget) return;
  if (!/^image\//.test(f.type)) { toast(t('img_only')); return; }
  try {
    const keepPng = pickTarget === 'second' && S.images.secondType === 'logo' && /png|webp|gif/.test(f.type);  // 로고 투명 배경 유지
    S.images[pickTarget] = await resizeImage(f, 1200, keepPng);
    save();
    if (afterPick) { const fn = afterPick; afterPick = null; fn(); } else render();
  } catch (err) { toast(t('photo_bad')); }
};
function resizeImage(file, max, png) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d');
      if (!png) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL(png ? 'image/png' : 'image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
    img.src = url;
  });
}

// ===================================================================
// 발행 요청 — Google 로그인 → 명함 문서 생성(draft) → 사진 업로드 → status 'pending'
// 관리자가 admin.html에서 승인하면 'published'가 되고 c/?id= 주소가 누구에게나 열린다.
// ===================================================================
let FB = null;
function fb() { if (!FB) { FB = acInitFirebase(); FB.storage = firebase.storage(); } return FB; }

async function signIn() {
  const { auth } = fb();
  await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  if (auth.currentUser) return auth.currentUser;
  const provider = new firebase.auth.GoogleAuthProvider();
  try { return (await auth.signInWithPopup(provider)).user; }
  catch (e) {
    if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return null;
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
      localStorage.setItem('autocard_resume_publish', '1');   // 돌아오면 이어서 발행
      await auth.signInWithRedirect(provider);
      return null;
    }
    throw e;
  }
}

async function publish() {
  const err = $('err'), btn = $('pubBtn');
  if (!$('agree').checked) { err.textContent = t('agree_need'); return; }
  if (hangulInBase() && !confirm(t('ko_confirm', { lang: AC_LANGS[base()] }))) return;
  err.textContent = ''; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + t('signing');
  try {
    const user = await signIn();
    if (!user) return;
    await doPublish(user, msg => { btn.innerHTML = '<span class="spinner"></span> ' + msg; });
    render();
  } catch (e) {
    console.error(e);
    err.textContent = t('pub_fail', { m: e.message || e.code });
  } finally {
    if ($('pubBtn')) { $('pubBtn').disabled = false; $('pubBtn').textContent = t('pub_btn'); }
  }
}

async function doPublish(user, progress) {
  const { db, storage } = fb();
  const ref = S.cardId ? db.collection('autocards').doc(S.cardId) : db.collection('autocards').doc();
  const now = Date.now();
  if (!S.createdAt) S.createdAt = now;
  progress(t('pg_doc'));
  // Storage 규칙이 이 문서의 ownerUid로 주인을 확인하므로, 사진보다 문서를 먼저 만든다
  await ref.set({ ownerUid: user.uid, ownerEmail: user.email, status: 'draft', createdAt: S.createdAt, updatedAt: now }, { merge: true });
  S.cardId = ref.id; save();

  const images = { ...S.images };
  for (const k of ['profile', 'second']) {
    if (!images[k] || !images[k].startsWith('data:')) continue;
    progress(k === 'profile' ? t('pg_profile') : t('pg_second'));
    const png = images[k].startsWith('data:image/png');
    const snap = await storage.ref(`autocards/${ref.id}/${k}.${png ? 'png' : 'jpg'}`).putString(images[k], 'data_url', { contentType: png ? 'image/png' : 'image/jpeg', cacheControl: 'public,max-age=31536000' });
    images[k] = await snap.ref.getDownloadURL();
  }
  S.images = images; save();

  progress(t('pg_send'));
  const data = { ...cardData(), images, ownerUid: user.uid, ownerEmail: user.email, status: 'pending', createdAt: S.createdAt, updatedAt: Date.now() };
  if (S.ref) data.referredBy = S.ref;
  await ref.set(data);
  S.status = 'pending'; save();
}

// 완료 화면에서 승인 여부 새로고침
async function refreshStatus() {
  if (!S.cardId) return;
  try {
    const { auth, db } = fb();
    await new Promise(r => { const u = auth.onAuthStateChanged(() => { u(); r(); }); });
    const snap = await db.collection('autocards').doc(S.cardId).get();
    if (snap.exists && snap.data().status !== S.status) { S.status = snap.data().status; save(); render(); }
  } catch (e) { /* 로그아웃 상태 등 — 무시 */ }
}

// 팝업이 막혀 redirect 로그인으로 돌아온 경우 이어서 발행
(async function resume() {
  if (localStorage.getItem('autocard_resume_publish') !== '1') return;
  localStorage.removeItem('autocard_resume_publish');
  try {
    const { auth } = fb();
    const res = await auth.getRedirectResult();
    const user = res.user || auth.currentUser;
    if (!user || S.status !== 'draft') return;
    toast(t('resume'));
    await doPublish(user, m => toast(m));
    render();
  } catch (e) { toast(t('pub_fail', { m: e.message })); }
})();

// 화면 언어 선택(오른쪽 위) — 아직 아무것도 안 적었으면 명함 기본 언어도 같이 바꿈
function fillUiSelect() { $('uiLang').innerHTML = [...AC_UI_LANGS, ...(acUiIsDynamic() ? [UI] : [])].map(l => `<option value="${l}" ${l === UI ? 'selected' : ''}>${AC_LANGS[l]}</option>`).join(''); }
fillUiSelect();
$('uiLang').onchange = e => {
  acSetUi(e.target.value);
  if (S.status === 'draft' && S.langs.length === 1 && !(S.name[base()] || '').trim() && !(S.title[base()] || '').trim()) S.langs = [UI];
  save(); render();
};
// 목록에 없는 언어(예: 인도네시아어)는 처음엔 영어로 보이다가 AI 번역이 오면 다시 그림. 명함에 넣은 그런 언어도 같이 준비
S.langs.forEach(acRegisterLang);
const dynLangs = [...new Set([UI, ...S.langs])].filter(l => !AC_UI_LANGS.includes(l));
if (dynLangs.length) {
  if (acUiIsDynamic()) setTimeout(() => toast('Translating the screen into ' + AC_LANGS[UI] + '…'), 300);
  Promise.all(dynLangs.map(l => acLoadLang(l).catch(() => false))).then(() => { fillUiSelect(); render(); });
}
render();
</script>
